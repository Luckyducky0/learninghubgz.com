<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080c10">
  <meta name="description" content="Dropzone: a fast browser-based 1v1 boxfight.">
  <title>Dropzone — 1v1 Boxfight</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 28%,#1b2926 0,#0b1113 52%,#080c10 100%);color:#f3f5f2;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(680px,100%);padding:clamp(28px,7vw,64px);border:1px solid #34443d;border-radius:20px;background:#10181ee8;box-shadow:0 24px 90px #0008;text-align:center}.logo{font-size:clamp(34px,8vw,58px);font-weight:950;letter-spacing:.04em}.logo span{color:#c7f464}.tag{margin:9px 0 28px;color:#9daaa4;font-size:12px;letter-spacing:.22em;text-transform:uppercase}.desc{max-width:470px;margin:0 auto 30px;color:#c2cbc5;font-size:15px;line-height:1.7}.play{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 26px;border-radius:9px;background:#c7f464;color:#11170c;font-weight:900;text-decoration:none;letter-spacing:.06em;box-shadow:0 8px 30px #c7f46430;transition:transform .15s,filter .15s}.play:hover{transform:translateY(-2px);filter:brightness(1.08)}.features{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:30px}.features span{padding:8px 11px;border:1px solid #293834;border-radius:999px;color:#aeb9b2;font-size:11px}.footer{margin-top:34px;color:#728079;font-size:11px}@media(max-width:480px){body{padding:14px}.card{border-radius:14px}.desc{font-size:14px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">DROPZONE<span>.</span></div>
    <div class="tag">1v1 Boxfight</div>
    <p class="desc">Jump into a fast browser arena. Practice against the bot or create a room and challenge a friend online.</p>
    <a class="play" href="./website%20wordle/boxfight.html">PLAY BOXFIGHT</a>
    <div class="features"><span>Runs in your browser</span><span>Build and edit walls</span><span>Online 1v1 rooms</span></div>
    <div class="footer">No download required · Works on Chromebook</div>
  </main>
</body>
</html>
